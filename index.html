  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-dowre] { display: none !important; }\n  }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#F6F5FA\">\n\n  <header style=\"position:sticky;top:0;z-index:60;backdrop-filter:blur(18px);background:rgba(246,245,250,.86);border-bottom:1px solid rgba(23,20,48,.07)\">\n    <div style=\"max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\n      <div style=\"display:block;flex:0 0 auto;width:118px;height:47px;overflow:hidden;position:relative\">\n        <img src=\"fc7daa6b-b5b6-4a49-8d8e-c4400c2839b5\" alt=\"مسیر\" style=\"position:absolute;top:0;right:0;width:118px;height:auto;display:block\">\n      <\u002Fdiv>\n      <div style=\"flex:1 1 auto\"><\u002Fdiv>\n      <a href=\"https://t.me/masirhelp\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:8px;background:#4D33B9;color:#fff;font-size:14px;font-weight:700;padding:12px 20px;border-radius:14px;box-shadow:0 10px 24px rgba(77,51,185,.28);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background .3s\" style-hover=\"transform:translateY(-3px);box-shadow:0 16px 34px rgba(77,51,185,.4);background:#3F29A0;color:#fff\">مشاوره‌ی انتخاب رشته<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section style=\"position:relative;padding:64px 24px 40px;overflow:hidden\">\n    <div style=\"position:absolute;top:-180px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(77,51,185,.18),rgba(77,51,185,0) 70%);animation:drift 18s ease-in-out infinite;pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:absolute;bottom:-260px;left:-140px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(44,193,175,.2),rgba(44,193,175,0) 70%);animation:drift2 22s ease-in-out infinite;pointer-events:none\"><\u002Fdiv>\n    <div style=\"max-width:1200px;margin:0 auto;position:relative;animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both\">\n      <div style=\"display:inline-flex;align-items:center;gap:8px;background:rgba(44,193,175,.14);color:#177F73;font-size:14px;font-weight:700;padding:8px 16px;border-radius:999px;margin-bottom:22px\">ابزار رایگان انتخاب رشته<\u002Fdiv>\n      <h1 style=\"font-size:48px;line-height:1.4;font-weight:900;margin:0 0 20px;letter-spacing:-.5px;max-width:820px\">با این رتبه، <span style=\"color:#4D33B9\">کجا قبول می‌شوی؟<\u002Fspan><\u002Fh1>\n      <p style=\"font-size:19px;line-height:2.1;color:#6B6884;margin:0;max-width:700px\">رتبه‌ات را وارد کن تا دو تخمین موازی ببینی: یکی اگر شرایط امسال آسان‌تر شود، یکی اگر سخت‌تر. بین این دو، فهرست واقع‌بینانه‌ی انتخاب‌هایت قرار می‌گیرد.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"max-width:1200px;margin:0 auto;padding:24px 24px 0\">\n    <div data-pad=\"1\" style=\"background:#fff;border:1px solid #EDEBF5;border-radius:28px;padding:40px\">\n\n      <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px\">\n        <h2 style=\"font-size:24px;font-weight:800;margin:0;line-height:1.6\">اطلاعات پایه<\u002Fh2>\n        <span style=\"font-size:13px;font-weight:800;color:#B2001A;background:rgba(230,28,55,.1);border-radius:999px;padding:7px 14px;line-height:1.5\">الزامی<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size:16px;line-height:2;color:#6B6884;margin:0 0 24px\">رتبه، رشته‌ی دبیرستانی و سهمیه‌ات را وارد کن تا تخمین‌ها را بر پایه‌ی آخرین رتبه‌های قبولی برایت حساب کنیم.<\u002Fp>\n\n      <sc-if value=\"{{ dataReady }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"font-size:14px;font-weight:700;color:#177F73;background:rgba(44,193,175,.12);border-radius:14px;padding:12px 18px;margin:0 0 24px;line-height:1.9\">{{ dataSummary }}<\u002Fp>\n      <\u002Fsc-if>\n\n      <!-- Optional: load fresh workbooks without rebuilding this file.\n           Hidden by CSS. Enable permanently by changing the\n           `#excel-upload{display:none}` rule near the top of this file to\n           `display:block`, or temporarily by opening the page with ?upload=1 -->\n      <div id=\"excel-upload\">\n        <p style=\"font-size:15px;font-weight:800;color:#171430;margin:0 0 10px;line-height:1.9\">به‌روزرسانی داده‌ها از فایل اکسل<\u002Fp>\n        <p style=\"font-size:14px;color:#6B6884;margin:0 0 14px;line-height:2\">فایل‌های «ریاضی و فیزیک.xlsx» و «علوم تجربی.xlsx» را انتخاب کن تا جایگزین داده‌های داخلی شوند. با تازه‌سازی صفحه دوباره به داده‌های داخلی برمی‌گردد.<\u002Fp>\n        <label style=\"display:inline-flex;align-items:center;height:48px;padding:0 22px;font-size:15px;font-weight:700;color:#fff;background:#4D33B9;border-radius:14px;cursor:pointer\">انتخاب فایل‌های اکسل<input type=\"file\" accept=\".xlsx\" multiple=\"multiple\" sc-camel-on-change=\"{{ onPick }}\" style=\"display:none\"><\u002Flabel>\n        <sc-if value=\"{{ showUploadError }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"font-size:14px;font-weight:700;color:#9A6E00;margin:14px 0 0;line-height:2\">{{ dataError }}<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div data-filters=\"1\" style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;padding:26px;background:#F6F5FA;border:1px solid #E3E0EF;border-radius:22px;margin-bottom:32px\">\n        <label style=\"display:block\">\n          <span style=\"display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700;color:#171430;margin-bottom:10px\">رتبه در منطقه<span style=\"color:#B2001A\">*<\u002Fspan><\u002Fspan>\n          <input type=\"text\" inputmode=\"numeric\" placeholder=\"مثلاً ۴۲۰۰\" value=\"{{ rank }}\" sc-camel-on-change=\"{{ onRank }}\" style=\"width:100%;height:54px;padding:0 18px;font-size:17px;font-weight:700;color:#171430;background:#fff;border:1px solid #E3E0EF;border-radius:14px;outline:none;transition:border-color .3s\" style-focus=\"border-color:#4D33B9\">\n        <\u002Flabel>\n        <label style=\"display:block\">\n          <span style=\"di shared string tables +\n   {group: {sheet: [[titleIdx, uniIdx, sectionIdx, cutoff], ...]}}. */\nfunction decodeDB() {\n  const data = {};\n  Object.keys(DB.G).forEach(function (g) {\n    const out = [];\n    const sheets = DB.G[g];\n    Object.keys(sheets).forEach(function (sheet) {\n      sheets[sheet].forEach(function (r) {\n        const p = splitSection(DB.S[r[2]]);\n        out.push({ g: g, sheet: sheet, f: DB.F[r[0]], u: DB.U[r[1]], q: p.q, d: p.d, cut: r[3] });\n      });\n    });\n    data[g] = out;\n  });\n  return data;\n}\n\n/* One sheet = one رشته. Column A carries the exact رشته‌محل title,\n   which can be narrower than the sheet name (e.g. «زیست فناوری» inside «زیست شناسی»). */\nfunction parseBook(group, bytes) {\n  const wb = XLSX.read(bytes, { type: 'array' });\n  const out = [];\n  wb.SheetNames.forEach(function (sn) {\n    const sheet = norm(sn);\n    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, blankrows: false });\n    rows.forEach(function (r, i) {\n      if (i === 0 || !r) return;\n      const f = norm(r[0]), u = norm(r[1]), sec = norm(r[2]);\n      const cut = parseInt(toLatin(r[3]), 10);\n      if (!f || !u || !sec || !cut) return;\n      const p = splitSection(sec);\n      out.push({ g: group, sheet: sheet, f: f, u: u, q: p.q, d: p.d, cut: cut });\n    });\n  });\n  return out;\n}\n\nfunction matchGroup(filename) {\n  const n = norm(filename).replace(/\\.xlsx?$/i, '');\n  if (n === R || /ریاضی/.test(n)) return R;\n  if (n === T || /تجربی/.test(n)) return T;\n  return '';\n}\n\nclass Component extends DCLogic {\n  state = {\n    rank: '',\n    group: '',\n    quota: '',\n    field: '',\n    uni: '',\n    dowre: Object.assign({}, ALL_ON),\n    applied: null,\n    error: '',\n    optPage: 1,\n    pesPage: 1,\n    data: decodeDB(),\n    dataStatus: 'ready',\n    dataError: '',\n    dataSource: 'embedded'\n  };\n\n  get perPage() { return Math.max(3, this.props.rowsPerPage ?? 6); }\n  get optFactor() { return this.props.optimisticFactor ?? 1.25; }\n  get pesFactor() { return this.props.pessimisticFactor ?? 0.8; }\n\n  /* The upload panel (#excel-upload) is hidden by CSS. Two ways to switch it on:\n     edit `#excel-upload{display:none}` in this file, or append ?upload=1 to the URL. */\n  componentDidMount() {\n    try {\n      if (/[?&]upload=1/.test(location.search)) {\n        document.documentElement.classList.add('show-upload');\n      }\n    } catch (e) { /* no-op */ }\n  }\n\n  /* Optional override: read fresh workbooks the visitor picks, replacing the\n     embedded data for whichever groups were supplied. */\n  onPick(e) {\n    const self = this;\n    const files = Array.prototype.slice.call((e.target && e.target.files) || []);\n    if (!files.length) return;\n    if (typeof XLSX === 'undefined') {\n      this.setState({ dataError: 'کتابخانه‌ی خواندن اکسل بارگذاری نشد.' });\n      return;\n    }\n    this.setState({ dataError: '' });\n    const jobs = files.map(function (file) {\n      return file.arrayBuffer().then(function (buf) {\n        return { g: matchGroup(file.name), name: file.name, buf: new Uint8Array(buf) };\n      });\n    });\n    Promise.all(jobs).then(function (parts) {\n      const data = Object.assign({}, self.state.data);\n      const unknown = [];\n      let loaded = 0;\n      parts.forEach(function (p) {\n        if (!p.g) { unknown.push(p.name); return; }\n        data[p.g] = parseBook(p.g, p.buf);\n        loaded++;\n      });\n      if (!loaded) {\n        self.setState({ dataError: 'نام فایل شناخته نشد: ' + unknown.join('، ') +\n          '. نام فایل باید «ریاضی و فیزیک.xlsx» یا «علوم تجربی.xlsx» باشد.' });\n        return;\n      }\n      self.setState({\n        data: data,\n        dataSource: 'picked',\n        field: '',\n        uni: '',\n        applied: null,\n        dataError: unknown.length ? 'این فایل‌ها نادیده گرفته شدند: ' + unknown.join('، ') + '.' : ''\n      });\n    }).catch(function (err) {\n      self.setState({ dataError: 'خواندن فایل ناموفق بود: ' + ((err && err.message) || err) });\n    });\n  }\n\n  rowsFor(group) {\n    const d = this.state.data;\n    if (!d || !group) return [];\n    return d[group] || [];\n  }\n\n  draft() {\n    return {\n      rank: toLatin(this.state.rank),\n      group: this.state.group,\n      quota: this.state.quota,\n      field: this.state.field,\n      uni: this.state.uni,\n      dowre: this.state.dowre\n    };\n  }\n\n  apply() {\n    const d = this.draft();\n    if (this.state.dataStatus !== 'ready') {\n      this.setState({ error: 'داده‌ها هنوز آماده نیستند؛ یک لحظه صبر کن.' });\n      return;\n    }\n    const missing = [];\n    if (!d.rank || parseInt(d.rank, 10) <= 0) missing.push('رتبه');\n    if (!d.group) missing.push('رشته‌ی دبیرستانی');\n    if (!d.quota) missing.push('سهمیه');\n    if (missing.length) {\n      this.setState({ error: missing.join(' و ') + ' را وارد کن.' });\n      return;\n    }\n    this.setState({\n      error: '',\n      applied: {\n        rank: d.rank, group: d.group, quota: d.quota, field: d.field, uni: d.uni,\n        dowre: Object.assign({}, d.dowre)\n      },\n      optPage: 1,\n      pesPage: 1\n    });\n  }\n\n  reset() {\n    this.setState({ field: '', uni: '', dowre: Object.assign({}, ALL_ON) });\n  }\n\n  toggle(k) {\n    this.setState(function (s) {\n      const next = Object.assign({}, s.dowre);\n      next[k] = !next[k];\n      return { dowre: next };\n    });\n  }\n\n  page(list, cur) {\n    const per = this.perPage;\n    const pages = Math.max(1, Math.ceil(list.length / per));\n    const c = Math.min(Math.max(1, cur), pages);\n    return { slice: list.slice((c - 1) * per, c * per), pages: pages, cur: c };\n  }\n\n  renderVals() {\n    const self = this;\n    const a = this.state.applied;\n    const status = this.state.dataStatus;\n    const ready = status === 'ready';\n    const hasRank = !!a && ready;\n\n    const groupRows = this.rowsFor(this.state.group);\n    const fieldOptions = this.state.group ? uniq(groupRows.map(function (r) { return r.sheet; })).sort() : [];\n    const uniPool = this.state.field\n      ? groupRows.filter(function (r) { return r.sheet === self.state.field; })\n      : [];\n    const uniOptions = uniq(uniPool.map(function (r) { return r.u; })).sort();\n\n    let dataSummary = '';\n    if (ready) {\n      const tot = GROUPS.reduce(function (n, g) { return n + self.rowsFor(g).length; }, 0);\n      dataSummary = fa(tot) + ' رشته‌محل در ' + fa(GROUPS.length) + ' گروه آزمایشی.';\n    }\n\n    const vals = {\n      rank: this.state.rank,\n      group: this.state.group,\n      quota: this.state.quota,\n      field: this.state.field,\n      uni: this.state.uni,\n      fieldOptions: fieldOptions,\n      uniOptions: uniOptions,\n      onRank: function (e) { self.setState({ rank: e.target.value }); },\n      onGroup: function (e) { self.setState({ group: e.target.value, field: '', uni: '' }); },\n      onQuota: function (e) { self.setState({ quota: e.target.value }); },\n      onField: function (e) { self.setState({ field: e.target.value, uni: '' }); },\n      onUni: function (e) { self.setState({ uni: e.target.value }); },\n      onPick: function (e) { self.onPick(e); },\n      apply: function () { self.apply(); },\n      reset: function () { self.reset(); },\n      hasRank: hasRank,\n      noRank: !hasRank,\n      showError: !!this.state.error,\n      errorText: this.state.error,\n      dataReady: ready,\n      showUploadError: !!this.state.dataError,\n      dataError: this.state.dataError,\n      dataSummary: dataSummary,\n      fieldOn: ready && !!this.state.group,\n      fieldOff: !(ready && !!this.state.group),\n      uniOn: ready && !!this.state.group && !!this.state.field,\n      uniOff: !(ready && !!this.state.group && !!this.state.field),\n      optPctFa: fa(Math.round((this.optFactor - 1) * 100)),\n      pesPctFa: fa(Math.round((1 - this.pesFactor) * 100))\n    };\n\n    DOWRE.forEach(function (k, i) {\n      const on = !!self.state.dowre[k];\n      vals['t' + KEYS[i]] = function () { self.toggle(k); };\n      vals['on' + KEYS[i]] = on;\n      vals['off' + KEYS[i]] = !on;\n    });\n\n    let dirty = false;\n    if (a) {\n      const d = this.draft();\n      dirty = d.rank !== a.rank || d.group !== a.group || d.quota !== a.quota ||\n        d.field !== a.field || d.uni !== a.uni ||\n        DOWRE.some(function (k) { return !!d.dowre[k] !== !!a.dowre[k]; });\n    }\n    vals.dirty = dirty && !this.state.error;\n\n    if (!hasRank) return vals;\n\n    const rankNum = parseInt(a.rank, 10);\n\n    const pool = this.rowsFor(a.group).filter(function (r) {\n      if (a.field && r.sheet !== a.field) return false;\n      if (a.uni && r.u !== a.uni) return false;\n      if (r.q && r.q !== a.quota) return false;\n      if (!a.dowre[r.d]) return false;\n      return true;\n    });\n    const byCut = function (x, y) { return x.cut - y.cut; };\n    const optList = pool.filter(function (r) { return rankNum <= r.cut * self.optFactor; }).sort(byCut);\n    const pesList = pool.filter(function (r) { return rankNum <= r.cut * self.pesFactor; }).sort(byCut);\n\n    const o = this.page(optList, this.state.optPage);\n    const p = this.page(pesList, this.state.pesPage);\n    const decorate = function (r) { return { f: r.f, u: r.u, d: r.d, cutFa: fa(r.cut) }; };\n\n    const activeD = DOWRE.filter(function (k) { return a.dowre[k]; });\n    const parts = [\n      a.field || 'همه‌ی رشته‌ها',\n      a.uni || 'همه‌ی دانشگاه‌ها',\n      activeD.length === DOWRE.length ? 'همه‌ی دوره‌ها' : (activeD.length ? activeD.join('، ') : 'بدون دوره')\n    ];\n\n    Object.assign(vals, {\n      rankFa: fa(rankNum),\n      poolFa: fa(pool.length),\n      baseSummary: a.group + ' · ' + a.quota,\n      filterSummary: parts.join(' · '),\n      optRows: o.slice.map(decorate),\n      pesRows: p.slice.map(decorate),\n      optCountLabel: fa(optList.length) + ' رشته‌محل',\n      pesCountLabel: fa(pesList.length) + ' رشته‌محل',\n      optEmpty: optList.length === 0,\n      pesEmpty: pesList.length === 0,\n      optPaged: o.pages > 1,\n      pesPaged: p.pages > 1,\n      optPageFa: fa(o.cur),\n      optPagesFa: fa(o.pages),\n      pesPageFa: fa(p.cur),\n      pesPagesFa: fa(p.pages),\n      optPrevOn: o.cur > 1,\n      optPrevOff: o.cur <= 1,\n      optNextOn: o.cur < o.pages,\n      optNextOff: o.cur >= o.pages,\n      pesPrevOn: p.cur > 1,\n      pesPrevOff: p.cur <= 1,\n      pesNextOn: p.cur < p.pages,\n      pesNextOff: p.cur >= p.pages,\n      optPrev: function () { self.setState({ optPage: Math.max(1, o.cur - 1) }); },\n      optNext: function () { self.setState({ optPage: Math.min(o.pages, o.cur + 1) }); },\n      pesPrev: function () { self.setState({ pesPage: Math.max(1, p.cur - 1) }); },\n      pesNext: function () { self.setState({ pesPage: Math.min(p.pages, p.cur + 1) }); }\n    });\n    return vals;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
